<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Szópártanulási feladat</title>

    <!-- jsPsych core and default styles -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">

    <!-- Plugins used in this initial version -->
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>

    <!-- Plugins for learning, typed recall, and confidence ratings -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background-color: white;
            color: #222;
        }

        /* Gives the experiment the full viewport height. */
        #experiment {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Centers short screens while allowing long screens to scroll. */
        #experiment .jspsych-content-wrapper {
            flex: 1 0 auto;
        }

        .jspsych-content {
            box-sizing: border-box;
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 24px;
            line-height: 1.5;
            text-align: center;
        }

        .instruction-text p {
            margin: 0 0 24px;
        }

        .jspsych-btn {
            padding: 12px 24px;
            font-family: inherit;
            font-size: 20px;
        }

        .word-pair {
            margin: 32px 0;
            font-size: 44px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        #recall-input {
            box-sizing: border-box;
            width: min(360px, 80vw);
            padding: 12px;
            font-family: inherit;
            font-size: 26px;
            text-align: center;
        }

        /* Left: skip. Right: submit the typed answer. */
        .recall-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 24px;
        }

        .recall-actions .recall-skip {
            background-color: #f1f3f5;
            border-color: #cbd0d6;
            color: #454b54;
        }

        .recall-actions .recall-skip:hover {
            background-color: #e2e6ea;
        }

        .recall-actions .recall-submit {
            background-color: #253247;
            border-color: #253247;
            color: white;
        }

        .recall-actions .recall-submit:hover {
            background-color: #172236;
        }

        .recall-actions .jspsych-btn:focus-visible {
            outline: 3px solid #4278b8;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <div id="experiment"></div>

    <script>
        "use strict";

        // INITIALIZATION

        const EXPERIMENT_VERSION = "WPM_2026-10-20_v1";
        const IS_JATOS = window.location.pathname.includes("/publix/");

        let participantId = "";
        let sessionStartUtc = "";

        const jsPsych = initJsPsych({
            display_element: "experiment",
            on_trial_finish: recordTrialData,
            on_finish: finishExperiment
        });

        const timeline = [];

        // SETTINGS AND MATERIALS

        const SETTINGS = {
            mainPairCount: 12,
            pairDisplayMs: 5000
        };

        const practicePairs = [
            { id: "practice_01", cue: "bögre", target: "felhő" },
            { id: "practice_02", cue: "kabát", target: "dió" }
        ];

        // Fixed project-specific pilot pool: 50 pairs, 100 distinct words.
        // Selected using Hungarian fastText cosine similarities in [0.15, 0.30].
        // Pair-selection seed: 20261020. Pair IDs and cue-target directions
        // match selected_pairs.csv and remain fixed across participants.
        const mainPairPool = [
            { id: "main_01", cue: "málna", target: "zsebkendő" },
            { id: "main_02", cue: "kapu", target: "asztal" },
            { id: "main_03", cue: "horgászbot", target: "kesztyű" },
            { id: "main_04", cue: "matrac", target: "lámpa" },
            { id: "main_05", cue: "bőrönd", target: "szemüveg" },
            { id: "main_06", cue: "fenyő", target: "tigris" },
            { id: "main_07", cue: "mókus", target: "tükör" },
            { id: "main_08", cue: "körte", target: "csengő" },
            { id: "main_09", cue: "hegy", target: "deszka" },
            { id: "main_10", cue: "tűz", target: "hold" },
            { id: "main_11", cue: "tányér", target: "kulcs" },
            { id: "main_12", cue: "acél", target: "doboz" },
            { id: "main_13", cue: "hajó", target: "függöny" },
            { id: "main_14", cue: "gyertya", target: "méh" },
            { id: "main_15", cue: "villa", target: "patak" },
            { id: "main_16", cue: "sátor", target: "zene" },
            { id: "main_17", cue: "tulipán", target: "táska" },
            { id: "main_18", cue: "hegedű", target: "borotva" },
            { id: "main_19", cue: "kefe", target: "béka" },
            { id: "main_20", cue: "kert", target: "krémleves" },
            { id: "main_21", cue: "turbina", target: "üveg" },
            { id: "main_22", cue: "csésze", target: "kavics" },
            { id: "main_23", cue: "szék", target: "pillangó" },
            { id: "main_24", cue: "térkép", target: "szalag" },
            { id: "main_25", cue: "kalap", target: "napraforgó" },
            { id: "main_26", cue: "pad", target: "bárány" },
            { id: "main_27", cue: "játék", target: "szőnyeg" },
            { id: "main_28", cue: "kosár", target: "nagyító" },
            { id: "main_29", cue: "átlag", target: "alma" },
            { id: "main_30", cue: "torna", target: "pince" },
            { id: "main_31", cue: "ablak", target: "rét" },
            { id: "main_32", cue: "óra", target: "hó" },
            { id: "main_33", cue: "tó", target: "szekrény" },
            { id: "main_34", cue: "búza", target: "család" },
            { id: "main_35", cue: "seprű", target: "kút" },
            { id: "main_36", cue: "város", target: "akadály" },
            { id: "main_37", cue: "ecset", target: "újság" },
            { id: "main_38", cue: "levél", target: "iskola" },
            { id: "main_39", cue: "villám", target: "létra" },
            { id: "main_40", cue: "szőlő", target: "csarnok" },
            { id: "main_41", cue: "kancsó", target: "vonat" },
            { id: "main_42", cue: "domb", target: "frizbi" },
            { id: "main_43", cue: "tölgy", target: "könyv" },
            { id: "main_44", cue: "párna", target: "laboratórium" },
            { id: "main_45", cue: "fodrász", target: "homok" },
            { id: "main_46", cue: "parancsnok", target: "torta" },
            { id: "main_47", cue: "gomb", target: "lepény" },
            { id: "main_48", cue: "függvény", target: "rigó" },
            { id: "main_49", cue: "fotel", target: "szivárvány" },
            { id: "main_50", cue: "kanál", target: "zokni" }
        ];

        // Rejects invalid settings instead of silently using the wrong number.
        if (
            !Number.isInteger(SETTINGS.mainPairCount) ||
            SETTINGS.mainPairCount < 1 ||
            SETTINGS.mainPairCount > mainPairPool.length
        ) {
            throw new Error(
                `A mainPairCount értéke 1 és ${mainPairPool.length} közötti egész szám legyen.`
            );
        }

        // Selects the participant's pairs once, without replacement.
        // Both learning and recall use this same selection.
        const mainPairs = jsPsych.randomization.sampleWithoutReplacement(
            mainPairPool,
            SETTINGS.mainPairCount
        );

        // HELPERS

        // Ignores capitalization and surrounding whitespace.
        // Accents remain meaningful; spelling mistakes are not corrected automatically.
        function normalizeWord(value) {
            return String(value)
                .normalize("NFC")
                .trim()
                .toLocaleLowerCase("hu-HU");
        }

        // Displays typed answers as text, never as executable HTML.
        function escapeHtml(value) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return String(value).replace(
                /[&<>"']/g,
                character => entities[character]
            );
        }

        // Creates consistent item information for every trial.
        function pairData(pair, phase, taskPart) {
            return {
                phase: phase,
                task_part: taskPart,
                pair_id: pair.id,
                cue_word: pair.cue,
                target_word: pair.target
            };
        }

        // Converts the plugin's generic names into explicit data fields.
        function recordTrialData(data) {
            data.trial_number = data.trial_index + 1;
            data.elapsed_time_ms = data.time_elapsed;
            data.response_time_ms = data.rt ?? "";

            data.confidence_rating =
                data.task_part === "confidence" ? data.response : "";

            delete data.time_elapsed;
            delete data.rt;
            delete data.response;
        }

        // DATA EXPORT AND SAVING

        function getExportData() {
            return jsPsych.data.get()
                .filterCustom(row =>
                    ["learning", "recall", "confidence"]
                        .includes(row.task_part)
                )
                .filterColumns([
                    "participant_id",
                    "experiment_version",
                    "main_pair_count",
                    "pair_pool_size",
                    "pair_display_ms",
                    "session_start_utc",
                    "run_mode",
                    "jatos_study_result_id",
                    "jatos_component_result_id",
                    "trial_number",
                    "phase",
                    "task_part",
                    "pair_id",
                    "cue_word",
                    "target_word",
                    "learning_position",
                    "elapsed_time_ms",
                    "response_time_ms",
                    "recall_status",
                    "recall_response_text",
                    "recall_response_normalized",
                    "recall_correct",
                    "confidence_rating"
                ]);
        }

        // Only pass trusted interface text to this helper.
        function showStatus(html) {
            document.getElementById("experiment").innerHTML =
                `<div class="jspsych-content">${html}</div>`;
        }

        async function finishExperiment() {
            const exportData = getExportData();
            const safeId = participantId.replace(/[^a-zA-Z0-9_-]/g, "_");
            const timestamp = sessionStartUtc.replace(/[:.]/g, "-");
            const fileName = `wordpair_${safeId}_${timestamp}.csv`;

            function downloadCsv() {
                exportData.localSave("csv", fileName);
            }

            if (!IS_JATOS) {
                showStatus(`
                    <p>A feladat véget ért.</p>
                    <p>A CSV letöltését elindítjuk. Ellenőrizze a letöltések között!</p>
                    <button id="download-csv" type="button" class="jspsych-btn">
                        CSV letöltése
                    </button>
                `);

                document.getElementById("download-csv").onclick = downloadCsv;
                downloadCsv();
                return;
            }

            // Reuses the same data on retry instead of appending duplicate rows.
            const csv = exportData.csv();
            let dataSubmitted = false;
            let saving = false;

            async function saveToJatos() {
                if (saving) return;
                saving = true;

                showStatus(`
                    <p>Adatok mentése…</p>
                    <p>Kérjük, ne zárja be és ne frissítse az oldalt!</p>
                `);

                try {
                    if (!dataSubmitted) {
                        await jatos.submitResultData(csv);
                        dataSubmitted = true;
                    }

                    // Supports both current and older JATOS versions.
                    const endStudy =
                        jatos.endStudyWithoutRedirect || jatos.endStudyAjax;

                    await endStudy.call(jatos, true);

                    showStatus(`
                        <p>Az adatokat sikeresen elmentettük.</p>
                        <p>Köszönjük a részvételét!</p>
                        <p>
                            Ha a kérdőívből érkezett, térjen vissza
                            a korábban megnyitott kérdőív fülére,
                            és folytassa a kitöltést!
                        </p>
                    `);
                } catch (error) {
                    console.error("Word-pair task saving failed:", error);

                    showStatus(`
                        <p>${dataSubmitted
                            ? "Az adatfeltöltés sikerült, de a futás lezárását nem sikerült visszaigazolni."
                            : "Az adatfeltöltést nem sikerült visszaigazolni."
                        }</p>
                        <p>
                            Kérjük, ne frissítse az oldalt!
                            Próbálja újra, vagy töltse le a biztonsági másolatot.
                        </p>
                        <p>
                            <button id="retry-save" type="button" class="jspsych-btn">
                                Mentés újrapróbálása
                            </button>
                        </p>
                        <p>
                            <button id="backup-csv" type="button" class="jspsych-btn">
                                Biztonsági CSV letöltése
                            </button>
                        </p>
                    `);

                    document.getElementById("retry-save").onclick = saveToJatos;
                    document.getElementById("backup-csv").onclick = downloadCsv;
                } finally {
                    saving = false;
                }
            }

            await saveToJatos();
        }
        // LEARNING TRIAL

        function createLearningTrial(pair, phase) {
            return {
                type: jsPsychHtmlKeyboardResponse,

                stimulus: `
            <div class="word-pair">
                ${escapeHtml(pair.cue.toLocaleLowerCase("hu-HU"))}
                –
                ${escapeHtml(pair.target.toLocaleLowerCase("hu-HU"))}
            </div>
        `,

                choices: "NO_KEYS",
                trial_duration: SETTINGS.pairDisplayMs,

                data: pairData(pair, phase, "learning")
            };
        }

        // RECALL FOLLOWED BY CONFIDENCE, UNLESS RECALL IS SKIPPED

        function createRecallSequence(pair, phase) {
            let recallRecord = null;

            const recallTrial = {
                type: jsPsychSurveyHtmlForm,

                preamble: `
            <p>Mi volt ennek a szónak a párja?</p>

            <div class="word-pair">
                ${escapeHtml(pair.cue.toLocaleLowerCase("hu-HU"))} – ?
            </div>
        `,

                html: `
            <p>
                <label for="recall-input">
                    Írja be a hozzá tartozó szót:
                </label>
            </p>

            <p>
                <input
                    id="recall-input"
                    name="recall_response_text"
                    type="text"
                    class="recall-input"
                    autocomplete="off"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    required
                >
            </p>

            <input
                id="recall-status"
                name="recall_status"
                type="hidden"
                value="answered"
            >
            
            <div id="recall-actions" class="recall-actions">
                <button
                    id="skip-recall"
                    type="button"
                    class="jspsych-btn recall-skip"
                    >
                    Nem emlékszem
                </button>
            </div>
            `,

                button_label: "Válasz rögzítése",
                autofocus: "recall-input",
                autocomplete: false,

                data: pairData(pair, phase, "recall"),

                on_load: function () {
                    const input = document.getElementById("recall-input");
                    const status = document.getElementById("recall-status");
                    const skipButton = document.getElementById("skip-recall");

                    // Moves the plugin's existing submit button next to the skip button.
                    const submitButton = document.getElementById(
                        "jspsych-survey-html-form-next"
                    );

                    submitButton.classList.add("recall-submit");

                    document.getElementById("recall-actions").appendChild(submitButton);

                    // Rejects empty answers and answers containing only whitespace.
                    function validateAnswer() {
                        input.setCustomValidity(
                            input.value.trim()
                                ? ""
                                : "Írjon be egy szót, vagy válassza a „Nem emlékszem” lehetőséget."
                        );
                    }

                    input.addEventListener("input", validateAnswer);
                    validateAnswer();

                    // Skipping submits an explicit status, not an empty word answer.
                    skipButton.addEventListener("click", function () {
                        status.value = "not_recalled";
                        input.value = "";
                        input.required = false;
                        input.setCustomValidity("");

                        input.form.requestSubmit();
                    });
                },

                on_finish: function (data) {
                    const submitted = data.response;
                    const answered = submitted.recall_status === "answered";

                    const rawAnswer = answered
                        ? submitted.recall_response_text
                        : "";

                    const normalizedAnswer = normalizeWord(rawAnswer);

                    recallRecord = {
                        recall_status: submitted.recall_status,
                        recall_response_text: rawAnswer,
                        recall_response_normalized: normalizedAnswer,

                        recall_correct:
                            answered &&
                            normalizedAnswer === normalizeWord(pair.target)
                    };

                    Object.assign(data, recallRecord);
                }
            };

            const confidenceTrial = {
                type: jsPsychHtmlSliderResponse,

                stimulus: function () {
                    return `
                <p>Az Ön válasza:</p>

                <div class="word-pair">
                    ${escapeHtml(pair.cue.toLocaleLowerCase("hu-HU"))}
                    –
                    ${escapeHtml(recallRecord.recall_response_text)}
                </div>

                <p>
                    Mennyire biztos abban, hogy a tanult szópárhoz
                    tartozó szót írta be?
                </p>
            `;
                },

                min: 0,
                max: 100,
                slider_start: 50,
                step: 1,
                require_movement: true,

                labels: [
                    "0 – egyáltalán nem biztos",
                    "100 – teljesen biztos"
                ],

                button_label: "Tovább",

                data: pairData(pair, phase, "confidence"),

                // Keeps the rating linked to the corresponding answer.
                on_finish: function (data) {
                    Object.assign(data, recallRecord);
                }
            };

            return {
                timeline: [
                    recallTrial,

                    {
                        timeline: [confidenceTrial],

                        conditional_function: function () {
                            return recallRecord !== null &&
                                recallRecord.recall_status === "answered";
                        }
                    }
                ]
            };
        }

        // FULLSCREEN ENTRY

        const enterFullscreen = {
            type: jsPsychFullscreen,
            fullscreen_mode: true,
            message: `
                <p>Kérjük, a feladatot teljes képernyős módban végezze el.</p>
            `,
            button_label: "Teljes képernyő indítása",
            delay_after: 1000
        };

        // INSTRUCTIONS

        const instructions = {
            type: jsPsychHtmlButtonResponse,

            stimulus: `
                <div class="instruction-text">
                    <h1>Szópártanulási feladat</h1>

                    <p>
                        Ebben a feladatban szópárokat fog látni.
                        Jegyezze meg, melyik szóhoz melyik másik szó tartozik!
                    </p>

                    <p>
                        Később minden pár első szavát megmutatjuk,
                        és Önnek be kell gépelnie a hozzá tartozó második szót.
                    </p>

                    <p>
                        Ha nem tudja felidézni a szót,
                        válassza a <strong>„Nem emlékszem”</strong> lehetőséget.
                    </p>

                    <p>
                        Minden megadott szóválasz után értékelnie kell,
                        mennyire biztos a válasz helyességében.
                    </p>
                </div>
            `,

            choices: ["Gyakorlás indítása"]
        };

        // FULLSCREEN EXIT

        const exitFullscreen = {
            type: jsPsychFullscreen,
            fullscreen_mode: false,
            delay_after: 0
        };

        // TIMELINE

        timeline.push(enterFullscreen);
        timeline.push(instructions);

        // Both practice pairs are learned before either is tested.
        practicePairs.forEach(pair => {
            timeline.push(createLearningTrial(pair, "practice"));
        });

        timeline.push({
            type: jsPsychHtmlButtonResponse,

            stimulus: `
        <p>Most próbálja felidézni a tanult szavak párját!</p>

        <p>
            Minden megadott szóválasz után értékelje a magabiztosságát.
            A „Nem emlékszem” válasz után ez a kérdés kimarad.
        </p>
    `,

            choices: ["Felidézés indítása"]
        });

        // Randomizes the order of the recall questions.
        const practiceTestOrder = jsPsych.randomization.shuffle([...practicePairs]);

        practiceTestOrder.forEach(pair => {
            timeline.push(createRecallSequence(pair, "practice"));
        });

        // MAIN TASK: LEARNING → RECALL

        timeline.push({
            type: jsPsychHtmlButtonResponse,

            stimulus: `
                <div class="instruction-text">
                    <p>A gyakorlás véget ért. Most a fő feladat következik.</p>

                    <p>
                        ${mainPairs.length} új szópárt fog látni,
                        páronként ${SETTINGS.pairDisplayMs / 1000} másodpercig.
                        Jegyezze meg a párokat!
                    </p>

                    <p>
                        Az utolsó szópár után automatikusan elkezdődik
                        a felidézés. Minden pár első szavát megmutatjuk,
                        és Önnek be kell gépelnie a hozzá tartozó második szót.
                    </p>

                    <p>
                        Minden megadott szóválasz után értékelje,
                        mennyire biztos a válasz helyességében.
                        Ha nem tudja felidézni a szót,
                        válassza a „Nem emlékszem” lehetőséget.
                        Ekkor a magabiztossági kérdés kimarad.
                    </p>
                </div>
            `,

            choices: ["Szópárok tanulásának indítása"]
        });

        // Shuffles intact pairs, not the words within them.
        const mainLearningOrder = jsPsych.randomization.shuffle([...mainPairs]);

        mainLearningOrder.forEach((pair, index) => {
            const trial = createLearningTrial(pair, "main");
            trial.data.learning_position = index + 1;
            timeline.push(trial);
        });

        // A fresh shuffle determines recall order independently of learning order.
        const mainTestOrder = jsPsych.randomization.shuffle([...mainPairs]);

        mainTestOrder.forEach(pair => {
            timeline.push(createRecallSequence(pair, "main"));
        });

        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <p>A feladat véget ért.</p>
                <p>Köszönjük a részvételét!</p>
            `,
            choices: ["Befejezés"]
        });

        timeline.push(exitFullscreen);

        // START

        function startExperiment(id) {
            participantId = String(id ?? "").trim();

            if (IS_JATOS && !participantId) {
                showStatus(`
                    <p>Hiányzik a résztvevői azonosító.</p>
                    <p>Kérjük, a kérdőívben kapott linken indítsa el a feladatot!</p>
                `);
                return;
            }

            participantId = participantId || "TEST_LOCAL";
            sessionStartUtc = new Date().toISOString();

            jsPsych.data.addProperties({
                participant_id: participantId,
                experiment_version: EXPERIMENT_VERSION,
                main_pair_count: mainPairs.length,
                pair_pool_size: mainPairPool.length,
                pair_display_ms: SETTINGS.pairDisplayMs,
                session_start_utc: sessionStartUtc,
                run_mode: IS_JATOS ? "jatos" : "local",
                jatos_study_result_id: IS_JATOS ? jatos.studyResultId : "",
                jatos_component_result_id: IS_JATOS ? jatos.componentResultId : ""
            });

            jsPsych.run(timeline);
        }

        if (IS_JATOS) {
            showStatus("<p>A feladat betöltése…</p>");

            const jatosScript = document.createElement("script");
            jatosScript.src = "jatos.js";

            jatosScript.onload = function () {
                jatos.onLoad(function () {
                    startExperiment(jatos.urlQueryParameters.participant_id);
                });
            };

            jatosScript.onerror = function () {
                showStatus(`
                    <p>A JATOS-kapcsolat betöltése nem sikerült.</p>
                    <p>A feladat nem indult el. Ellenőrizze az internetkapcsolatát!</p>
                `);
            };

            document.head.appendChild(jatosScript);
        } else {
            const parameters = new URLSearchParams(window.location.search);
            startExperiment(parameters.get("participant_id"));
        }
    </script>
</body>

</html>
